name: Wochenplan veröffentlichen

# GitHub Pages kann nur Dateien ausliefern, kein Node. Deshalb holt dieser Lauf
# die Termine aus Discord, legt sie als statische Dateien ab und veröffentlicht
# `public/`, damit eine neu angesetzte Raid auch ohne Zutun von jemandem
# auftaucht.
on:
  schedule:
    # Einmal pro Stunde, und zwar bei Minute 23. GitHub stellt in der Doku ausdrücklich
    # fest: planmäßige Läufe können unter Last verzögert und verworfen werden
    # ("some queued jobs may be dropped"). Ausprobiert: alle Viertelstunde waren
    # vier Warteschlangen-Einträge pro Stunde, angekommen ist in neun Stunden
    # genau einer – die Seite war sechs Stunden alt, obwohl der Zeitplan das nicht
    # vorsah. Eine einzelne Zeitmarke ist ein einzelner Eintrag in der
    # Warteschlange und kommt damit deutlich zuverlässiger durch.
    # Minute 23 statt :00, weil GitHub Läufe auf die volle Stunde zurückstellt.
    - cron: '23 * * * *'
  workflow_dispatch: # auf Zuruf, z. B. wenn ein Raid kurzfristig geändert wurde
  push:
    branches: [main]
    paths:
      # Alles, was das Deployment tatsächlich verändert. `lanes.json` stand
      # hier zunächst nicht drin: Eine neue oder geänderte Spur wäre dann erst
      # beim nächsten Zeitplanlauf online gewesen – sechs Stunden, obwohl sie im
      # Repo längst eingetragen war. Dasselbe gilt für den Erzeuger selbst.
      - 'public/**'
      - 'src/**'
      - 'tools/snapshot.mjs'
      - 'lanes.json'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/publish.yml'

# Läufe dürfen sich nicht gegenseitig abbrechen. Genau das war vorher eingestellt,
# um Token zu sparen – aber ein wartender planmäßiger Lauf wird dann stillschweigend
# verworfen, sobald ein Push-Lauf startet. Bei 30 Sekunden Laufzeit und einer
# Marke pro Stunde ist Überschneiden ausgeschlossen, der Abbruch brächte also nur
# Verluste.
concurrency:
  group: publish-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# Öffentliche Repos zahlen Standard-Runner frei, 24 Läufe am Tag also nichts.
# Für Besucher ist es ebenfalls billig: Ein erneutes Deployment ändert `app.js`,
# `style.css` und das 2-MB-Bild nicht an, ihre ETags bleiben gleich, und der
# Browser beantwortet die Nachfrage mit 304, ohne einen Byte neu zu holen. Wirklich
# frisch ist nur die kleine Datendatei, und die holt sich die Seite ohnehin nur,
# wenn sich der Erzeugungszeitpunkt geändert hat.
env:
  TIMEZONE: Europe/Berlin
  WEEKS_BACK: '2'
  WEEKS_FORWARD: '8'

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/configure-pages@v5

      # Ohne Token schreibt das Skript Demo-Daten und veröffentlicht sie
      # unbemerkt. Das ist der teuerste Fehler in diesem Lauf, deshalb bricht
      # er hier ab, statt eine Woche voller erfundener Raids online zu stellen.
      - name: Discord-Zugang prüfen
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          if [ -z "$DISCORD_TOKEN" ] || [ -z "$DISCORD_GUILD_ID" ]; then
            echo "::error::DISCORD_TOKEN und DISCORD_GUILD_ID müssen als Repository-Secret gesetzt sein."
            exit 1
          fi

      - name: Wochen als Dateien erzeugen
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: node tools/snapshot.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
